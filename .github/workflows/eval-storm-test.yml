name: eval-storm-test

# docs/tasks/0083: boots three minimal NixOS VMs — each importing the
# real modules/dev/eval-storm.nix module directly with different
# castle.evalStorm.* option values — and proves castle-eval-storm-check
# counts real nix-daemon client connections (driven by real
# `nix store ping` calls) and trips at the inclusive `count >=
# threshold` boundary, with and without a notifyCommand configured. See
# test/eval-storm/test.nix for the three-node design.
#
# Its own workflow, not folded into check.yml's flake-check job, same
# reasoning as the other VM-test workflows in this repo: this boots
# real VMs under QEMU/KVM, which bare `nix flake check` must never be
# made to do. Scoped narrower than desktop-loop-test.yml or
# direnv-delivery-test.yml: this test imports no modules/base, home,
# desktop, or hosts/* at all (see test.nix's own header for why), so
# only modules/dev/eval-storm.nix itself, the flake, and the test file
# can affect it.
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/dev/eval-storm.nix"
      - "test/eval-storm/**"
      - "test/ci/**"
      - ".github/workflows/eval-storm-test.yml"
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/dev/eval-storm.nix"
      - "test/eval-storm/**"
      - "test/ci/**"
      - ".github/workflows/eval-storm-test.yml"
  # Lets a branch that isn't (yet) on a PR trigger this workflow by hand
  # via `gh workflow run` — the only way to get a real CI result while
  # iterating, since there is no `nix` on the development machine (see
  # this repo's CLAUDE.md).
  workflow_dispatch: {}

jobs:
  eval-storm-test:
    runs-on: ubuntu-latest
    # magic-nix-cache-action authenticates to the cache via OIDC.
    permissions:
      contents: read
      id-token: write
    # Four minimal (no desktop, no home-manager) VMs booting to
    # multi-user.target, each driving a handful of `nix store ping`
    # calls — docs/tasks/0088's `rearm` node adds one genuine ~75s
    # wait for its window to drain, so the whole test now runs in a
    # few minutes once the closure is substituted. Generous headroom
    # over that for a cold cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # Same fix, same reasoning as the other VM-test workflows:
      # GitHub's hosted runners have nested virtualization available but
      # /dev/kvm isn't group-writable by default, and this test's three
      # VMs under TCG emulation would be needlessly slow rather than
      # simply not run.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-castle-turing-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ls -la /dev/kvm
          else
            msg="KVM unavailable on this runner; failing fast rather than timing out opaquely under TCG emulation."
            echo "$msg" >&2
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # test/ci/retry-on-known-transient.sh: the same bounded,
      # signature-matched retry the sibling VM-test workflows use for
      # CI's own recognizable infrastructure flakes (docs/tasks/0041).
      # A failure that doesn't match a known signature gets zero
      # retries and surfaces as this step's real exit code.
      - name: Build and run the eval-storm test
        run: test/ci/retry-on-known-transient.sh -- nix build .#eval-storm-test -L
