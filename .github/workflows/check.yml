name: check

on:
  # docs/tasks/0018: a PR that only changes prose (a backlog entry, a
  # task brief, two files under docs/) still ran all four jobs below in
  # full — flake-check alone took over four minutes, measured on PR #42.
  # vm-install-test.yml and desktop-loop-test.yml already skip that PR
  # via their own allowlist `paths:` filters, and claude-code-review.yml
  # already skips it via its own paths-ignore (see that file's comment)
  # — this workflow was the one gate still firing on pure prose, because
  # it carried no path filter at all. paths-ignore below closes that gap
  # without touching the two allowlisted workflows (out of scope here;
  # see the brief's Non-goals) or claude-code-review.yml's own filter.
  #
  # This is deliberately NOT `**/*.md` — that would also match, and
  # therefore skip the build gate for, two READMEs that sit *inside* Nix
  # derivation sources rather than being pure documentation:
  #   * agent/README.md            (modules/agent: src = ../../agent)
  #   * modules/desktop/wallpapers/README.md
  #                                 (modules/desktop: src = ./wallpapers)
  # Editing either changes the derivation's store path, so a change
  # there must still trigger flake-check and friends. `*.md` (no `**`)
  # matches only top-level files — `*` does not cross a `/` in GitHub's
  # path-filter syntax — so it skips top-level prose like README.md and
  # CLAUDE.md while leaving both derivation-source READMEs unmatched and
  # the gate intact for them. See docs/tasks/0018-docs-only-ci-skip.md
  # for the directory-hash proof that those two paths are build-relevant.
  #
  # Depends on `main` having no branch protection today (confirmed via
  # the GitHub API returning 404 for branch protection on `main` — no
  # required status checks exist to strand). If `check` is ever made a
  # required status, this filter turns a docs-only PR into one
  # permanently pending on a check that never reports. The fix at that
  # point is not to revert this: it's the always-report shim — keep this
  # workflow triggering on everything (drop paths-ignore) and instead
  # gate each job internally on the changed paths, so the `check` status
  # itself still always reports rather than sitting silent.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
  push:
    branches:
      - main
    # Same paths-ignore and same reasoning as pull_request above — this
    # only covers direct pushes/merges to main, so a docs-only merge
    # skips flake-check here too instead of only on the PR that preceded it.
    paths-ignore:
      - "docs/**"
      - "*.md"
  # Lets a branch that isn't (yet) on a PR trigger this workflow by hand
  # via `gh workflow run` — needed to get real CI results while
  # iterating on a feature branch before opening a PR against it.
  # Unaffected by paths-ignore above: workflow_dispatch has no path
  # filter and stays the escape hatch for forcing a run on a docs-only
  # branch by hand.
  workflow_dispatch: {}

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - run: nix flake check

  # Proposal 03's hardening test (docs/architecture.md), taking its first
  # steps: the scripted-tenant agent loop, docs/tasks/0008. Deliberately
  # its own job, not folded into flake-check above: this harness needs no
  # Nix at all (agent/castle is stdlib Python; test/agent-loop/run.sh is
  # plain bash), so it runs on the stock Ubuntu runner's own toolchain
  # rather than paying for a Nix install it has no use for.
  agent-loop-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/agent-loop/run.sh
      # Proposal 03's hardening test, second half
      # (docs/tasks/0009-ambient-intake.md): the worker seat re-tenanted
      # with no structural change, proven by running the same loop
      # twice with two differently-shaped scripted workers and diffing
      # a normalized summary of the outcomes. Same runner, no Nix,
      # same reason as the job above.
      - run: test/agent-loop/tenant-swap.sh
      # Where the journal is allowed to live
      # (docs/tasks/0030-state-outside-the-flake.md): the four layouts
      # `castle validate` and `castle digest` have to tell apart, one
      # of which — a `state/` committed inside the flake repo — puts
      # the resident's whole decision history in the world-readable
      # Nix store on every rebuild. In this job rather than the
      # dispatch one because it drives no worker and no sweep; it needs
      # nothing but `castle`, `git` and stdlib python3, all of which
      # the stock runner already has, for the same reason given above.
      - run: test/agent-loop/state-layout.sh

  # Automatic dispatch (docs/tasks/0021-auto-dispatch.md): the sweep a
  # systemd path unit and timer trigger on a real host, driven directly
  # here — the watermark, the per-request lease, the durable claim
  # record, the reaper, the closed `outcome` vocabulary, and the
  # deliberate non-behavior that an answer does not re-open an
  # already-worked errand. Its own job next to the two around it, same
  # stock-runner style and same reason: no Nix is involved. It is also
  # the first thing anywhere to exercise the real
  # castle.agent.worker.command contract end to end
  # (test/agent-loop/contract-worker*.sh) — run.sh's scripted workers
  # deliberately bypass `cmd_work`.
  dispatch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/agent-loop/dispatch-test.sh
      # Errand resumption (docs/tasks/0023-resume-cold.md): the same
      # sweep driven past the point where it used to stop — a worker
      # marks a question blocking and files no work, the resident
      # answers, and exactly one further turn runs with a fresh tenant
      # handed the errand's own records and nothing else. In this job
      # rather than a fifth one because it drives the identical
      # mechanism with the identical toolchain; a separate job would
      # pay for another checkout to prove nothing extra.
      - run: test/agent-loop/resume.sh
      # The worker seat's two checkouts
      # (docs/tasks/0024-config-target.md): which repository a diff is
      # against, the honest refusal when the private one is not
      # configured, and the mechanism checkout degrading rather than
      # refusing when it is configured but broken. In this job rather
      # than the agent-loop one for the reason resume.sh is here — it
      # drives `castle dispatch` and `castle work` against the real
      # worker contract, which is exactly what this job already exists
      # to cover, and the two share every helper and convention.
      - run: test/agent-loop/config-target.sh

  # The modal's logic (agent/castle-modal), driven headlessly: canned
  # stdin piped at it, asserting on the request record it produces and
  # the status fold it renders — no compositor, no foot, no Sway
  # involved (docs/tasks/0009-ambient-intake.md's verification plan).
  modal-headless-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/agent-loop/modal-headless-test.sh

  # docs/tasks/0009 gave this repo its first managed Sway config
  # (modules/home's wayland.windowManager.sway) and a foot config
  # alongside it, but flake-check above only proves the *Nix options*
  # evaluate — it never asks Sway's or foot's own parser to look at
  # the file they actually produce. That gap matters more than usual
  # here: modules/desktop deliberately runs no auto-login
  # (greetd+tuigreet — see that module's header comment and
  # docs/tasks/0003-findings.md finding #1), so a Sway config that
  # fails to parse turns into a resident stuck at a login prompt that
  # can never produce a session — the exact lockout class this project
  # has scar tissue about. This job closes that gap directly.
  #
  # It deliberately does NOT lean on home-manager's own
  # `wayland.windowManager.sway.checkConfig` option, even though that
  # option defaults to true today and (per modules/services/window-
  # managers/i3-sway/sway.nix at this flake's pinned home-manager rev,
  # see flake.lock) already runs an equivalent check as a side effect
  # of *building* the generated config's derivation. checkConfig is
  # just another Nix option — something could flip it false for an
  # unrelated reason later and silently reopen this exact hole. This
  # job builds the config/package store paths itself and runs each
  # program's real parser over the real file, independent of that
  # upstream default.
  sway-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Build the generated configs and the packages that read them
        run: |
          # Attribute paths below were confirmed by reading
          # home-manager's actual module source at this flake's pinned
          # rev (flake.lock: home-manager rev
          # c8058ecc1329a71a3c99c4d0353dba4009a66152) — not guessed:
          #   * modules/services/window-managers/i3-sway/sway.nix
          #     writes the rendered Sway config as the derivation at
          #     `xdg.configFile."sway/config".source` (a
          #     pkgs.writeTextFile home-manager names "sway.conf"),
          #     and wires up `wayland.windowManager.sway.package`
          #     (pkgs.sway.override { wrapperFeatures.gtk = true; ...}
          #     per modules/home — not bare pkgs.sway, which may carry
          #     different wrapper flags) as the binary that reads it.
          #   * modules/programs/foot.nix does the same for foot:
          #     `xdg.configFile."foot/foot.ini".source` (present only
          #     when programs.foot.settings is non-empty, which it is
          #     here via nixosConfigurations.example's
          #     terminalFontSize override) and `programs.foot.package`.
          # Both live under `config.home-manager.users.resident`
          # because nixosConfigurations.example wires modules/home's
          # home-manager.users.${castle.admin.username}, and that
          # flake sets castle.admin.username = "resident" as its
          # placeholder resident.
          HM='.#nixosConfigurations.example.config.home-manager.users.resident'

          SWAY_CONFIG=$(nix build --no-link --print-out-paths "$HM.xdg.configFile.\"sway/config\".source")
          SWAY_PKG=$(nix build --no-link --print-out-paths "$HM.wayland.windowManager.sway.package")
          FOOT_CONFIG=$(nix build --no-link --print-out-paths "$HM.xdg.configFile.\"foot/foot.ini\".source")
          FOOT_PKG=$(nix build --no-link --print-out-paths "$HM.programs.foot.package")
          # xvfb-run pulled from the exact same nixpkgs instance this
          # system uses (nixosSystem exposes `pkgs` alongside `config`
          # at the top level) so it can't drift from the pin above.
          XVFB_RUN=$(nix build --no-link --print-out-paths '.#nixosConfigurations.example.pkgs.xvfb-run')/bin/xvfb-run

          {
            echo "SWAY_CONFIG=$SWAY_CONFIG"
            echo "SWAY_PKG=$SWAY_PKG"
            echo "FOOT_CONFIG=$FOOT_CONFIG"
            echo "FOOT_PKG=$FOOT_PKG"
            echo "XVFB_RUN=$XVFB_RUN"
          } >> "$GITHUB_ENV"

          echo "--- generated sway config ($SWAY_CONFIG) ---"
          cat "$SWAY_CONFIG"
          echo "--- generated foot config ($FOOT_CONFIG) ---"
          cat "$FOOT_CONFIG"

      - name: Run sway --validate over the generated config
        run: |
          # --validate parses the config and exits without starting a
          # real session, but Sway still does some startup probing
          # even in validate mode (swaywm/sway#4691), so it needs
          # *something* to attach to and a GPU it's willing to run on
          # even headlessly: xvfb-run supplies a throwaway X server
          # for that, and --unsupported-gpu waives the GPU check. This
          # is the identical flag combination home-manager's own
          # checkPhase uses (see the previous step's comment) — copied
          # here deliberately so this check keeps working even if this
          # repo ever turns checkConfig off. DBUS_SESSION_BUS_ADDRESS
          # and a scratch, private XDG_RUNTIME_DIR keep Sway from
          # reaching for a real session bus or runtime dir that
          # doesn't exist on this runner — this is a validate run, not
          # a real session, so no seat and no compositor are needed or
          # provided.
          export DBUS_SESSION_BUS_ADDRESS=/dev/null
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          "$XVFB_RUN" "$SWAY_PKG/bin/sway" --config "$SWAY_CONFIG" --validate --unsupported-gpu

      - name: Assert the generated Sway config still carries the default keybindings
        run: |
          # sway --validate (above) only proves the config *parses* — it
          # is perfectly happy with a config that binds exactly one key,
          # which is precisely how the 0009 review pass's finding 1
          # lockout looked: modules/home's own binding, defined at
          # normal priority, silently discarded home-manager's entire
          # default keybinding set instead of adding to it (see the long
          # comment on that option in modules/home/default.nix for the
          # mechanism). Nothing about --validate would have caught that,
          # so it can't be trusted alone to guard the regression. This
          # step grep-asserts that a representative sample of the
          # defaults home-manager ships (terminal, kill, exit, one
          # workspace switch) and both of this repo's own castle-modal
          # chords — Mod4+Shift+Return (compose) and Mod4+Shift+a
          # (answer, docs/tasks/0022) — are present in the same
          # generated file. A second castle chord landing at the wrong
          # priority is exactly the shape this check exists to catch.
          # Both castle entries name the FULL exec command including
          # `--mode`: a prefix match would stay green if a binding
          # regressed to the wrong mode, which is a live risk now that
          # two chords differ only in that argument. It is
          # deliberately a sample, not an exhaustive re-listing of every
          # default binding — the point is to fail loudly if the whole
          # default set goes missing again, not to pin every keybind
          # home-manager happens to ship today.
          #
          # 'bindsym Mod1+Shift+space floating toggle' is in the sample
          # for a second, different reason (docs/tasks/0019, defect 2):
          # it's not the binding that broke — under the default Mod1
          # modifier it never collided with anything — but its presence
          # makes the *class* of bug (a private-layer binding silently
          # displacing a stock one under some other modifier) visible in
          # CI at all, which it previously was not. The Mod4 case that
          # actually collided is asserted separately, at eval time, by
          # flake.nix's nixosConfigurations.example-mod4 — this job only
          # ever renders the Mod1 default (see that assertion's comment
          # for why a second rendered job here would be redundant).
          missing=0
          for expected in \
            'bindsym Mod1+Return exec' \
            'bindsym Mod1+Shift+q kill' \
            'bindsym Mod1+Shift+e exec swaynag' \
            'bindsym Mod1+1 workspace number 1' \
            'bindsym Mod1+Shift+space floating toggle' \
            'bindsym Mod4+Shift+Return exec foot --app-id=castle-modal -e castle-modal --mode compose' \
            'bindsym Mod4+Shift+a exec foot --app-id=castle-modal -e castle-modal --mode answer'
          do
            if ! grep -qF "$expected" "$SWAY_CONFIG"; then
              echo "MISSING expected binding: $expected"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more expected Sway keybindings were not found in the generated config."
            echo "If this is a deliberate rebind, update the expected list above. If it isn't,"
            echo "this is the finding-1 lockout regressing: a keybindings definition at the"
            echo "wrong priority is silently discarding home-manager's default bindings again."
            exit 1
          fi

      - name: Assert the workspace-1 binding is the first workspace binding in the config
        run: |
          # Presence alone can't catch defect 1 (docs/tasks/0019): Sway
          # takes the *first* workspace binding mentioned in the config
          # as its initial workspace, but home-manager emits
          # `keybindings` sorted by key name, so `Mod1+0`'s
          # `workspace number 10` sorts before `Mod1+1`'s
          # `workspace number 1` and wins unless
          # `wayland.windowManager.sway.config.defaultWorkspace`
          # (modules/home/default.nix) hoists the workspace-1 binding to
          # the front. That hoist works by exact string equality against
          # the binding's *action*, not its key, so a wrong spelling
          # there (e.g. "workspace 1") silently matches nothing — the
          # `workspace number 1` binding the step above already asserts
          # is present would still be present, just not first. Only an
          # order-sensitive check catches that no-op, which is why this
          # is a separate step from the presence check above rather than
          # another line in its grep list.
          #
          # Written against the action ("workspace number N"), not the
          # key, so it stays correct regardless of which modifier a
          # config uses — same reasoning as the fix itself. The pattern
          # anchors on a trailing digit run with nothing after it, so
          # "workspace number 1" cannot accidentally match the
          # "workspace number 10" line (that line ends in "0", not "1").
          FIRST_WS=$(grep -nE '^bindsym [^ ]+ workspace number [0-9]+$' "$SWAY_CONFIG" | head -n1)
          case "$FIRST_WS" in
            *"workspace number 1") ;;
            *) echo "First workspace binding in the generated config is: $FIRST_WS"
               echo "Expected the 'workspace number 1' binding first. Sway takes the first"
               echo "workspace mentioned in the config as the initial workspace, and"
               echo "home-manager only hoists it when defaultWorkspace string-equals the"
               echo "binding's action exactly (modules/home/default.nix, docs/tasks/0019)."
               echo "A silent no-op there looks exactly like this."
               exit 1 ;;
          esac

      - name: Assert the generated Sway config's wallpaper names a file that exists
        run: |
          # docs/tasks/0014: castle.display.wallpaper defaults on
          # (modules/desktop's own `mkDefault`, not an opt-in like the
          # other castle.display settings), so every generated config
          # should carry a `bg <path> <mode>` line unless a private
          # layer explicitly disabled it.
          #
          # An earlier version of this comment claimed `sway --validate`
          # doesn't check that a `bg` path resolves to anything, by
          # analogy with the finding-1 lockout this job's other steps
          # guard against — that claim was never verified here and was
          # wrong. Confirmed by deliberately breaking this on a
          # throwaway branch (docs/tasks/0014's verification pass,
          # logged in that session's scratchpad): Sway's own
          # sway/commands/output/background.c does an access() check
          # and refuses to load a config whose `bg` file is missing, and
          # home-manager's `checkConfig` (on by default; see the header
          # comment on this job) runs that same validation as a build
          # step, so a missing background file already fails the
          # "Build the generated configs" step above with a real, if
          # buried-in-derivation-log, error before this step is ever
          # reached — see that failure's exact text in the decision log.
          #
          # This step still earns its place as a second, independent
          # layer: it reads the actual generated text rather than
          # trusting a specific Sway version's internal behavior (which
          # this repo has no control over and doesn't pin the way it
          # pins nixpkgs itself), it still fires if `checkConfig` is
          # ever turned off (the exact scenario the "Run sway
          # --validate" step above exists for), and it gives a short,
          # purpose-built failure message instead of requiring someone
          # to read Sway's raw stderr out of a failed derivation build.
          BG_LINE=$(grep -E '^[[:space:]]*bg[[:space:]]' "$SWAY_CONFIG" || true)
          if [ -z "$BG_LINE" ]; then
            echo "No 'bg' line found in the generated Sway config."
            echo "castle.display.wallpaper defaults on (modules/desktop/default.nix); if it was"
            echo "deliberately turned off for this configuration, update this check's expectation."
            exit 1
          fi
          BG_PATH=$(echo "$BG_LINE" | awk '{print $2}')
          echo "bg line: $BG_LINE"
          echo "asserting file exists: $BG_PATH"
          if [ ! -f "$BG_PATH" ]; then
            echo "castle.display.wallpaper's generated 'bg' line names a file that does not"
            echo "exist in the store: $BG_PATH"
            echo "This is a black-desktop bug waiting to happen: something between the"
            echo "castle.display.wallpaper option and Sway's own file-access check let it"
            echo "through anyway."
            exit 1
          fi

      - name: Assert the generated configs carry the legibility defaults
        run: |
          # docs/tasks/0017-legible-defaults.md. Four of the five text
          # surfaces are driven by castle.display options; three of them
          # land in these two generated files, so grep-assert them here
          # rather than trusting that the options merely evaluated.
          #
          # These expectations are the FRAMEWORK defaults, not the
          # reference resident's values. nixosConfigurations.example
          # overrides terminalFont/terminalFontSize on purpose (to prove
          # a private layer wins — see flake.nix's assertion), so the
          # foot expectation below is that override, while the Sway ones
          # are the untouched framework defaults. A stranger's private
          # layer will differ from both; that is the point, and it is
          # why nothing here expects Iosevka.
          #
          # The swaybar line is the one worth keeping: `fonts` in Sway
          # covers window titles and swaynag but NOT the bar, so the bar
          # needs its own `bars` entry — and defining `bars` replaces
          # home-manager's default list wholesale, which silently drops
          # statusCommand if it is not restated. Asserting both the bar
          # font and the status_command catches that regression.
          missing=0
          check() {
            if ! grep -qF "$2" "$1"; then
              echo "MISSING in $(basename "$1"): $2"
              missing=1
            fi
          }
          check "$FOOT_CONFIG" 'font=Example Mono:size=14'
          check "$SWAY_CONFIG" 'font pango:sans-serif 11.000000'
          check "$SWAY_CONFIG" 'status_command'
          # Two occurrences expected: the top-level font and the bar's.
          n=$(grep -cF 'font pango:sans-serif 11.000000' "$SWAY_CONFIG" || true)
          if [ "$n" -lt 2 ]; then
            echo "Expected the UI font in BOTH the top-level config and the bar block,"
            echo "found $n occurrence(s). Sway's top-level 'fonts' does not reach swaybar;"
            echo "if the bars entry went missing, the bar has silently reverted to 8pt."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "The generated configs no longer carry the legibility defaults."
            echo "If this is a deliberate change, update these expectations AND"
            echo "docs/tasks/0017-legible-defaults.md, which records why each value is what it is."
            exit 1
          fi

      - name: Assert the console font resolves and its package ships it
        run: |
          # The fifth surface. castle.display.consoleFont is deliberately
          # host-defaulted, not framework-defaulted (a console font is a
          # pixel grid; the VT never sees castle.display.scale). It is
          # asserted against .example, which resolves to the host value
          # only because .example imports nixosModules.host-xps9370 —
          # so if that import is ever dropped, this check fails here
          # rather than somewhere that looks unrelated. See
          # docs/tasks/0017 and flake.nix's assertion.
          CONSOLE_FONT=$(nix eval --raw '.#nixosConfigurations.example.config.console.font')
          echo "console.font resolves to: $CONSOLE_FONT"
          if [ "$CONSOLE_FONT" != "spleen-16x32" ]; then
            echo "Expected hosts/xps9370's lib.mkDefault console font to survive."
            exit 1
          fi
          # Naming a font is useless if nothing provides it: modules/desktop
          # ships pkgs.spleen for exactly this reason, the same way it ships
          # bibata-cursors for cursorTheme. Prove the named font is really in
          # the package rather than assuming the name is spelled right.
          SPLEEN=$(nix build --no-link --print-out-paths '.#nixosConfigurations.example.pkgs.spleen')
          # Scoped to share/consolefonts, not the whole output: that is
          # the only path console.packages links (pathsToLink), so a
          # package shipping its PSF solely under share/fonts would pass
          # a whole-output search and still fail to resolve at boot.
          # spleen ships both, which is exactly how a loose search hides
          # the difference.
          if ! find "$SPLEEN/share/consolefonts" -name "$CONSOLE_FONT.psf*" | grep -q .; then
            echo "console.font names '$CONSOLE_FONT' but pkgs.spleen ships no such font:"
            find "$SPLEEN" -name '*.psf*' -printf '  %f\n'
            exit 1
          fi
          echo "found $CONSOLE_FONT in $SPLEEN"

      - name: Assert the ergonomics wiring reaches the generated configs
        run: |
          # docs/tasks/0020. Everything this task adds is an unobserved
          # default of exactly the class 0019 and 0017 were about: a
          # keybinding that silently vanishes, or a status entry that
          # silently returns, produces no error anywhere. sway --validate
          # is happy either way, so these are grep assertions against the
          # real generated artifacts.
          missing=0
          need() {
            if ! grep -qF "$2" "$1"; then
              echo "MISSING in $(basename "$1"): $2"
              missing=1
            fi
          }
          refuse() {
            if grep -qF "$2" "$1"; then
              echo "UNEXPECTEDLY PRESENT in $(basename "$1"): $2"
              missing=1
            fi
          }

          # Media and brightness keys. Asserted by keysym rather than by
          # store path, which would pin a hash and churn on every bump.
          for k in XF86MonBrightnessUp XF86MonBrightnessDown \
                   XF86AudioRaiseVolume XF86AudioLowerVolume \
                   XF86AudioMute XF86AudioMicMute
          do
            need "$SWAY_CONFIG" "bindsym $k exec"
          done
          # The volume ceiling: without -l 1.0 a held key pushes the sink
          # into software boost, which distorts rather than getting louder.
          need "$SWAY_CONFIG" "set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
          # The default set must still be there alongside them — the
          # finding-1 lockout guard, restated for this task's additions.
          need "$SWAY_CONFIG" 'bindsym Mod1+Return exec'

          I3_CONFIG=$(nix build --no-link --print-out-paths \
            '.#nixosConfigurations.example.config.home-manager.users.resident.xdg.configFile."i3status/config".source')
          echo "--- generated i3status config ($I3_CONFIG) ---"
          cat "$I3_CONFIG"
          # .example imports host-xps9370, which declares no ethernet
          # port — so both false faults must be gone while battery stays.
          need   "$I3_CONFIG" 'order += "battery all"'
          refuse "$I3_CONFIG" 'order += "ipv6"'
          refuse "$I3_CONFIG" 'order += "ethernet _first_"'

          if [ "$missing" -ne 0 ]; then
            echo
            echo "The ergonomics wiring no longer reaches the generated configs."
            echo "If this is deliberate, update these expectations AND"
            echo "docs/tasks/0020-laptop-ergonomics.md. Note that a missing"
            echo "XF86 binding or a returning ipv6/ethernet entry is invisible"
            echo "to sway --validate and to nix flake check — this step is the"
            echo "only thing that sees it."
            exit 1
          fi

      - name: Run foot --check-config over the generated config
        run: |
          # foot ships its own config-check mode (-C/--check-config):
          # parses the file and exits 0 (ok) or 230 (invalid), with no
          # Wayland connection needed — it exists for exactly this,
          # validating a config without opening a terminal. No xvfb
          # needed here, unlike Sway above.
          "$FOOT_PKG/bin/foot" --check-config --config "$FOOT_CONFIG"
