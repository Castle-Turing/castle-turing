# When Codex (ChatGPT Codex Connector) reviews a PR, Claude evaluates the
# findings, pushes fixes for the valid ones, and replies to the rest.
#
# Loop prevention, by construction:
#   - Triggers ONLY on reviews authored by the Codex bot — never on Claude's
#     own comments, reviews, or pushes, and never on humans (the @claude
#     mention flow in claude.yml covers those).
#   - Claude is forbidden from writing "@codex" anywhere, so it can never
#     summon the reviewer back.
#   - One concurrency slot per PR: stacked Codex reviews collapse into the
#     latest run instead of queueing repeated responses.
#   - Same-repo branches only: never runs with write access against a fork.
#
# Receipt verification, by construction (docs/tasks/0045):
#   - A model's own report that it posted something is a claim, not
#     evidence — see the PR #73 incident where the prompt described a
#     summary comment as posted and it never landed. Two independent
#     checks, neither something the prompt can talk its way around:
#       - The "Wrap gh" step shadows `gh` on PATH with a shim that logs
#         every failing `gh` invocation; "Fail loudly if any gh call
#         failed" checks that log, not the model's narration. This
#         catches a post that was attempted and rejected.
#       - "Confirm the review's receipts actually landed" queries the
#         forge directly afterward: every inline comment on the
#         triggering review must now have a reply, and the PR's
#         top-level comment count must have increased. This catches
#         the PR #73 shape specifically — a post that was never
#         attempted at all, which a call-failure log can't see because
#         no call means no failure to log.
name: Claude — handle Codex review

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: codex-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  handle-codex-review:
    if: |
      github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
      github.event.review.state != 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Wrap gh to catch silent posting failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          real_gh="$(command -v gh)"
          shim_dir="$RUNNER_TEMP/gh-shim"
          mkdir -p "$shim_dir"
          log="$RUNNER_TEMP/gh-call-failures.log"
          : > "$log"
          cat > "$shim_dir/gh" <<SHIM
          #!/usr/bin/env bash
          "$real_gh" "\$@"
          code=\$?
          if [ "\$code" -ne 0 ]; then
            printf 'FAILED (exit %s): gh %s\n' "\$code" "\$*" >> "$log"
          fi
          exit "\$code"
          SHIM
          chmod +x "$shim_dir/gh"
          echo "$shim_dir" >> "$GITHUB_PATH"

          # Snapshot the PR's top-level comment count now, before Claude
          # runs, so "Confirm the review's receipts actually landed" can
          # tell whether the required step-4 summary comment actually got
          # posted rather than just claimed.
          "$real_gh" api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}" \
            --jq .comments > "$RUNNER_TEMP/pr-comment-count-before.txt"

      - name: Run Claude on Codex's findings
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'chatgpt-codex-connector[bot]'
          prompt: |
            Codex just submitted a code review on PR #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. You are on the PR branch.

            1. Read the review and its inline comments:
               gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ github.event.review.id }}"
               gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ github.event.review.id }}/comments"
            2. Judge each finding on its merits. For valid findings, implement
               the smallest correct fix, commit, and push to this branch. For
               findings you disagree with or that are out of the PR's scope,
               reply explaining why — never silently skip a finding. Every
               disagreement between reviewers must stay legible to the human.
            3. Leave the receipt WHERE THE FINDING LIVES: for each inline
               review thread, POST the reply first (repos/.../pulls/N/comments/COMMENT_ID/replies
               via gh api), citing the fix commit hash or your reasoning for
               declining — only once that POST has actually succeeded. Then
               resolve each addressed thread via the GraphQL
               resolveReviewThread mutation, only after its own reply has
               posted; never resolve a thread you have not replied to. A
               top-level summary without inline replies is not sufficient —
               the human reads threads.
            4. Finish with one PR comment summarizing what you fixed and what
               you declined, with reasoning. Never describe an artifact — a
               reply, a resolved thread, this summary comment itself — as
               posted unless the post call actually succeeded. If a post
               fails, say plainly "I could not post <X>" instead of
               describing X as if it exists.

            Hard rules:
            - Never write the Codex trigger phrase (the reviewer's @-mention)
              in any comment, commit message, or file — it would re-summon
              the reviewer and start a loop.
            - Never merge, close, approve, or re-request review on the PR;
              the human makes every merge decision.
            - Do not expand the diff beyond what the findings require.
            - Follow the repository's CLAUDE.md.
          claude_args: '--allowedTools "Read,Grep,Glob,Edit,Write,Bash(git:*),Bash(gh pr:*),Bash(gh api:*),Bash(nix:*)"'

      - name: Fail loudly if any gh call failed this run
        if: always()
        run: |
          log="$RUNNER_TEMP/gh-call-failures.log"
          if [ -s "$log" ]; then
            echo "::error::One or more gh calls failed during this run — a receipt (reply, resolved thread, or summary comment) may not have posted. See below:"
            cat "$log"
            exit 1
          fi
          echo "Every gh call in this run exited zero."

      - name: Confirm the review's receipts actually landed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=0

          review_comment_ids="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ github.event.review.id }}/comments" \
            --paginate --jq '.[].id')"

          if [ -n "$review_comment_ids" ]; then
            all_comments="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments" \
              --paginate --jq '.[]' | jq -s '.')"
            for id in $review_comment_ids; do
              has_reply="$(echo "$all_comments" | jq --argjson id "$id" '[.[] | select(.in_reply_to_id == $id)] | length')"
              if [ "$has_reply" -eq 0 ]; then
                echo "::error::No reply found on review comment $id — a finding may have been silently skipped, not just declined without a reply."
                missing=1
              fi
            done
          fi

          before="$(cat "$RUNNER_TEMP/pr-comment-count-before.txt" 2>/dev/null || echo 0)"
          after="$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}" --jq .comments)"
          if [ "$after" -le "$before" ]; then
            echo "::error::No new top-level PR comment was posted — the required summary comment (step 4) may be missing, the PR #73 failure shape this task exists to catch."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Every inline finding on this review has a reply, and a new summary comment was posted."
