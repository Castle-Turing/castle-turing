name: vm-install-test

# The install-loop test harness (docs/tasks/0004): exercises the real
# nixos-anywhere install path against a QEMU/OVMF VM and goes red when the
# mechanism regresses. Only runs when something that could plausibly
# affect it changes — it's the slowest job in the repo by a wide margin.
#
# Runs on PRs (the gate) and on merges to main. The main runs are not a
# second gate — they exist so the Nix store cache below lands in a scope
# other PRs can read. Actions caches written by a PR run are scoped to
# that PR's own ref; only caches written on the default branch are
# readable repo-wide. Without the push trigger the cache warms nothing
# but re-pushes to the same PR. Paths are duplicated rather than shared
# via a YAML anchor: GitHub Actions does not expand anchors in workflow
# files.
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "hosts/**"
      - "test/vm-install/**"
      - "test/ci/**"
      - ".github/workflows/vm-install-test.yml"
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "hosts/**"
      - "test/vm-install/**"
      - "test/ci/**"
      - ".github/workflows/vm-install-test.yml"
  # Lets a branch that isn't (yet) on a PR trigger this workflow by hand
  # via `gh workflow run` — needed to get a real run of the anti-bricking
  # regression test (docs/tasks/0008: vm-test must stay green with no
  # agent module imported) while iterating on a feature branch, without
  # opening a PR just to get CI to fire.
  workflow_dispatch: {}

jobs:
  vm-install-test:
    runs-on: ubuntu-latest
    # magic-nix-cache-action authenticates to the cache via OIDC.
    permissions:
      contents: read
      id-token: write
    # Bumped from 25: docs/tasks/0005 added modules/desktop (Sway, Firefox,
    # fonts, portals, PipeWire) to the system under test, a meaningfully
    # bigger closure than modules/base alone, even mostly cache-substituted.
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # The dominant CI cost is re-substituting QEMU, OVMF, nixos-anywhere
      # and the full system closure on every run. magic-nix-cache-action
      # backs the store with GitHub's Actions cache, invalidating
      # fine-grained by store path (not by flake.lock hash). Same vendor
      # as the installer action above.
      #
      # Expect partial warmth, not a cold-start elimination: GitHub caps
      # the Actions cache at 10 GB per repository and this job's closures
      # (desktop system + installer ISO + QEMU/OVMF) are large enough to
      # push entries out by LRU. The first run under this action logged
      # ~140 "rate limit exceeded"/"throttled Magic Nix Cache" responses,
      # so measure the runtime delta — including the post-job upload,
      # which counts against timeout-minutes below — before claiming a win.
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # GitHub's hosted Ubuntu runners support nested virtualization, but
      # /dev/kvm isn't group-writable by default — this is the standard
      # fix (used by e.g. android-emulator-runner).
      #
      # Fail fast and explicitly if this didn't work, rather than let a
      # bare `ls` failure crash the step opaquely (no message beyond a
      # red X) or, the other wrong direction, silently swallow it and
      # let the job proceed. run.sh's own `[ -r /dev/kvm ]` check and its
      # ACCEL=tcg fallback are correct and deliberately left as-is — but
      # that fallback exists for a developer's KVM-less box running this
      # harness *locally* (test/vm-install/README.md). In CI, on a
      # runner that's supposed to have KVM, no-KVM isn't a condition to
      # degrade through: TCG-emulated x86 is slow enough that the
      # harness's four boots would blow well past this job's
      # timeout-minutes budget, turning an instant, legible "KVM is
      # broken on this runner" into an opaque 25-minute timeout instead.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-castle-turing-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ls -la /dev/kvm
          else
            msg="KVM unavailable on this runner; the harness's TCG fallback would exceed the job's time budget — failing fast rather than timing out opaquely."
            echo "$msg" >&2
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # docs/tasks/0041: a bounded, signature-matched retry for CI's own
      # recognizable infrastructure flakes — docs/backlog/ci-flakes-
      # deserve-retries-not-vigilance.md's PR #63 incident (FlakeHub's
      # login endpoint returning a transient auth error, then the GitHub
      # Actions cache rate-limiting narinfo downloads into HTTP 418s).
      # test/ci/retry-on-known-transient.sh (shared with the sibling
      # desktop-loop-test.yml workflow's identical need) holds the retry
      # loop itself; test/ci/known-transient-ci-failure.sh holds the one
      # commented signature list it checks a failure's log against. A
      # failure that doesn't match is a real regression and gets
      # exactly zero retries, surfaced as this step's real exit code. At
      # most one retry, ever: a second failure — matched or not — is
      # surfaced as-is, because two failures on the same runner are no
      # longer "transient" by this entry's own definition.
      - name: Run the install-loop harness
        run: test/ci/retry-on-known-transient.sh -- test/vm-install/run.sh
        env:
          CASTLE_HARNESS_LOG_DIR: ${{ github.workspace }}/test/vm-install/harness-logs

      - name: Upload harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-install-harness-logs
          # Not a dot-directory: actions/upload-artifact excludes hidden
          # files by default, which silently dropped every log the first
          # time this ran (path was .ci-logs/).
          path: test/vm-install/harness-logs/
          if-no-files-found: ignore
          retention-days: 14
