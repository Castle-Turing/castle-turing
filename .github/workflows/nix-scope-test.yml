name: nix-scope-test

# docs/tasks/0089: boots one minimal NixOS VM importing the real
# modules/dev/nix-scope.nix and proves a runaway nix evaluation dies
# alone — SIGKILL inside its own transient scope at the configured
# MemoryMax — while the invoking shell survives and receives the
# wrapper's stderr explanation; plus the root and opt-out fallback
# paths. See test/nix-scope/test.nix for the probe design.
#
# Its own workflow, not folded into check.yml's flake-check job, same
# reasoning as the other VM-test workflows in this repo: this boots a
# real VM under QEMU/KVM, which bare `nix flake check` must never be
# made to do. Scoped like eval-storm-test.yml: the test imports no
# modules/base, home, desktop, or hosts/* at all, so only
# modules/dev/nix-scope.nix itself, the flake, and the test file can
# affect it.
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/dev/nix-scope.nix"
      - "test/nix-scope/**"
      - "test/ci/**"
      - ".github/workflows/nix-scope-test.yml"
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/dev/nix-scope.nix"
      - "test/nix-scope/**"
      - "test/ci/**"
      - ".github/workflows/nix-scope-test.yml"
  # Lets a branch that isn't (yet) on a PR trigger this workflow by hand
  # via `gh workflow run` — the only way to get a real CI result while
  # iterating, since VM tests never build locally on a resident host
  # (see this repo's CLAUDE.md).
  workflow_dispatch: {}

jobs:
  nix-scope-test:
    runs-on: ubuntu-latest
    # magic-nix-cache-action authenticates to the cache via OIDC.
    permissions:
      contents: read
      id-token: write
    # One minimal VM booting to multi-user.target and killing one
    # ~192M evaluation — the kill itself is near-instant; the
    # headroom is for a cold cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # Same fix, same reasoning as the other VM-test workflows:
      # GitHub's hosted runners have nested virtualization available but
      # /dev/kvm isn't group-writable by default, and this test's VM
      # under TCG emulation would be needlessly slow rather than
      # simply not run.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-castle-turing-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ls -la /dev/kvm
          else
            msg="KVM unavailable on this runner; failing fast rather than timing out opaquely under TCG emulation."
            echo "$msg" >&2
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # test/ci/retry-on-known-transient.sh: the same bounded,
      # signature-matched retry the sibling VM-test workflows use for
      # CI's own recognizable infrastructure flakes (docs/tasks/0041).
      # A failure that doesn't match a known signature gets zero
      # retries and surfaces as this step's real exit code.
      - name: Build and run the nix-scope test
        run: test/ci/retry-on-known-transient.sh -- nix build .#nix-scope-test -L
