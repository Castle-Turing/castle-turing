name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Documentation-only PRs are reviewed by the human, not by a model.
    # This is the only workflow in the repo that spends model tokens on
    # every PR, and a large share of this repo's PRs are pure prose —
    # design principles, task briefs, backlog entries — where the review
    # a model gives is worth less than it costs and the human is reading
    # the text closely anyway.
    #
    # paths-ignore is the right operator rather than paths: the job runs
    # whenever a PR touches *anything* outside this list, so a change
    # that mixes code and docs is still reviewed in full. Only a PR whose
    # every changed file matches is skipped.
    #
    # Note this deliberately does NOT filter check.yml (flake-check,
    # agent-loop-test, modal-headless-test, sway-config-check). Those
    # spend no model tokens, finish in under a minute, and are the gate —
    # path-filtering a would-be required check is how a docs PR ends up
    # blocked forever on a status that never reports.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

