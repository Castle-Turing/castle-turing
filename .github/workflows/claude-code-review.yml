name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Documentation-only PRs are reviewed by the human, not by a model.
    # This is the only workflow in the repo that spends model tokens on
    # every PR, and a large share of this repo's PRs are pure prose —
    # design principles, task briefs, backlog entries — where the review
    # a model gives is worth less than it costs and the human is reading
    # the text closely anyway.
    #
    # paths-ignore is the right operator rather than paths: the job runs
    # whenever a PR touches *anything* outside this list, so a change
    # that mixes code and docs is still reviewed in full. Only a PR whose
    # every changed file matches is skipped.
    #
    # check.yml (flake-check, agent-loop-test, modal-headless-test,
    # sway-config-check) is filtered too, as of docs/tasks/0018 — it
    # used to run unconditionally on the reasoning that those jobs
    # "finish in under a minute," which was wrong by roughly 4x
    # (flake-check alone measured over four minutes on a docs-only PR).
    # That reasoning also warned that path-filtering a would-be required
    # check is how a docs PR ends up blocked forever on a status that
    # never reports — a real hazard in general, but moot today: `main`
    # carries no branch protection, so there is no required status check
    # for a docs PR to be stranded on. See check.yml's own `on:` comment
    # for the mitigation (an always-report shim) if that ever changes.
    #
    # check.yml's own paths-ignore is deliberately narrower than this
    # workflow's `**/*.md` below: it uses `*.md`, which does not match
    # agent/README.md or modules/desktop/wallpapers/README.md, because
    # both sit inside Nix derivation sources (modules/agent's
    # `src = ../../agent`, modules/desktop's `src = ./wallpapers`) and
    # editing either changes a store path the build gate must still see.
    # That asymmetry is deliberate, not an oversight: skipping a
    # *review* on a docs change is harmless — a human reads prose PRs
    # closely anyway — but skipping the *build* on a change that can
    # alter the built system is not, so this workflow can afford the
    # broader `**/*.md` while check.yml cannot.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'claude'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

