name: app-scopes-test

# docs/tasks/0084: boots the real desktop stack in a NixOS VM, logs in
# through the real greetd+tuigreet prompt, presses all three real
# app-launch chords (the terminal, the launcher, the Castle chord), and
# asserts each launch lands in a transient scope cgroup of its own
# rather than sharing the compositor's. See test/app-scopes/test.nix
# for what it does and does not prove.
#
# Its own workflow, not folded into check.yml's flake-check job, same
# reasoning as desktop-loop-test.yml, oomd-liveness-test.yml and
# vm-install-test.yml: this boots a real VM under QEMU/KVM, which bare
# `nix flake check` (a `checks.*` job) must never be made to do. The
# cheap half of this task's detector — that the generated Sway config
# still routes all three bindings through `castle-launch` — lives in
# check.yml's sway-config-check instead and runs on every pull request.
#
# Path filters mirror desktop-loop-test.yml's, minus the agent-loop
# fixtures this test does not use: it imports modules/base, home,
# desktop and agent, so any modules/ or agent/ change can affect it. It
# imports no hosts/* module (nixosTest supplies its own virtual
# hardware profile), so hosts/** is deliberately out of scope.
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "agent/**"
      - "test/app-scopes/**"
      - "test/ci/**"
      - ".github/workflows/app-scopes-test.yml"
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "agent/**"
      - "test/app-scopes/**"
      - "test/ci/**"
      - ".github/workflows/app-scopes-test.yml"
  # Lets a branch that isn't (yet) on a PR trigger this workflow by hand
  # via `gh workflow run` — the only way to get a real CI result while
  # iterating.
  workflow_dispatch: {}

jobs:
  app-scopes-test:
    runs-on: ubuntu-latest
    # magic-nix-cache-action authenticates to the cache via OIDC.
    permissions:
      contents: read
      id-token: write
    # One graphical boot with a real tuigreet login and three chord
    # presses, on a desktop closure without modules/dev's Emacs or
    # claude-code. Meaningfully lighter than desktop-loop-test's 75
    # minutes, with headroom for a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # The dominant cost is re-substituting the desktop closure (and
      # tesseract, for the OCR that paces the two tuigreet prompts) on
      # every run — same reasoning as the sibling VM-test workflows.
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # Same fix, same reasoning as the other VM-test workflows:
      # GitHub's hosted runners have nested virtualization available
      # but /dev/kvm isn't group-writable by default, and a graphical
      # boot with OCR on top would blow past any reasonable budget
      # under TCG emulation in a way that reads as "the probe is
      # broken" rather than "this runner has no KVM".
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-castle-turing-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ls -la /dev/kvm
          else
            msg="KVM unavailable on this runner; a graphical boot under TCG would exceed the job's time budget — failing fast rather than timing out opaquely."
            echo "$msg" >&2
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # test/ci/retry-on-known-transient.sh: the same bounded,
      # signature-matched retry the sibling VM-test workflows use for
      # CI's own recognizable infrastructure flakes (docs/tasks/0041).
      # A failure that doesn't match a known signature gets zero
      # retries and surfaces as this step's real exit code.
      #
      # `--keep-failed` preserves the QEMU/OCR sandbox, screenshots
      # included, on a red run; `-L` streams the driver's own log, which
      # on an OCR or `retry` timeout prints exactly what the last
      # attempt saw. The pre-attempt `rm -rf` is the same
      # discarded-attempt staleness fix desktop-loop-test.yml carries:
      # without it, a first attempt discarded as transient leaves its
      # build directory behind for the collection step below to glob.
      - name: Build and run the app-scopes test
        run: |
          test/ci/retry-on-known-transient.sh --stdout /tmp/app-scopes-out-path.txt -- \
            bash -c 'sudo rm -rf /tmp/nix-build-*app-scopes* 2>/dev/null; exec nix build .#app-scopes-test -L --keep-failed --no-link --print-out-paths'

      # The store path is validated rather than trusted: an empty file
      # here would turn `cp -r "$OUT"/.` into `cp -r /.`, which is how
      # desktop-loop-test.yml once uploaded 21,881 files off the
      # runner's root. Refusing anything that is not a /nix/store path
      # makes that a loud error instead.
      - name: Collect artifacts (screenshots) from a successful run
        if: success()
        run: |
          set -euo pipefail
          mkdir -p app-scopes-artifacts
          OUT="$(cat /tmp/app-scopes-out-path.txt)"
          case "$OUT" in
            /nix/store/*) ;;
            *)
              echo "app-scopes-out-path.txt did not contain a Nix store path (got: '$OUT'); refusing to copy from it." >&2
              exit 1
              ;;
          esac
          cp -r "$OUT"/. app-scopes-artifacts/
          echo "Collected $(find app-scopes-artifacts -type f | wc -l) file(s) from $OUT"

      # Best-effort only: --keep-failed's build directory may be owned
      # by a nix build user other than the runner's account, and its
      # exact naming is not a contract worth failing the job over. The
      # file count is printed either way, so "found nothing" is a
      # visible line rather than indistinguishable from success.
      - name: Collect artifacts (screenshots) from a failed run
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p app-scopes-artifacts
          sudo find /tmp -maxdepth 1 -name 'nix-build-*app-scopes*' \
            -exec sh -c 'cp -r "$1"/. app-scopes-artifacts/ 2>/dev/null' _ {} \; || true
          sudo chown -R "$(id -u):$(id -g)" app-scopes-artifacts || true
          echo "Collected $(find app-scopes-artifacts -type f | wc -l) file(s) from any --keep-failed build directory found"

      - name: Upload app-scopes-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-scopes-test-artifacts
          path: app-scopes-artifacts/
          if-no-files-found: ignore
          retention-days: 14
