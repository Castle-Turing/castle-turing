name: desktop-loop-test

# docs/tasks/0011: boots the real desktop stack (modules/base, home,
# desktop, dev, agent) in a NixOS VM via the nixosTest framework, logs
# in through the real greetd+tuigreet prompt, presses the real
# $mod+Shift+Return keybinding, and asserts on the journal records the
# ambient-intake loop actually produces — see test/desktop-loop/test.nix
# for what it does and does not change about the mechanism under test.
#
# Its own workflow, not folded into check.yml's flake-check job:
# test/desktop-loop/test.nix is exposed as `packages.x86_64-linux.
# desktop-loop-test`, not `checks.*`, specifically so bare
# `nix flake check` (what flake-check runs, unfiltered, on every PR)
# never has to build it. This workflow is the only thing that builds it,
# same division of labor vm-install-test.yml already established for
# test/vm-install/'s own slow harness — see this workflow's path filters
# below for what can trigger it, mirroring that precedent. Deliberately
# does NOT filter on hosts/**: unlike vm-install-test.yml, this test
# imports no hosts/* module at all (nixosTest supplies its own virtual
# hardware profile — see test/desktop-loop/test.nix's header), so a
# hosts/ change cannot affect it.
on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "agent/**"
      - "test/desktop-loop/**"
      - "test/agent-loop/contract-worker.sh"
      - "test/agent-loop/check_assertions.py"
      - ".github/workflows/desktop-loop-test.yml"
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "agent/**"
      - "test/desktop-loop/**"
      - "test/agent-loop/contract-worker.sh"
      - "test/agent-loop/check_assertions.py"
      - ".github/workflows/desktop-loop-test.yml"
  # Lets a branch that isn't (yet) on a PR trigger this workflow by hand
  # via `gh workflow run` — the only way to get a real CI result while
  # iterating, since there is no `nix` on the development machine (see
  # this repo's CLAUDE.md).
  workflow_dispatch: {}

jobs:
  desktop-loop-test:
    runs-on: ubuntu-latest
    # magic-nix-cache-action authenticates to the cache via OIDC.
    permissions:
      contents: read
      id-token: write
    # Generous and unproven: this is the first time this loop has ever
    # been driven end to end (docs/tasks/0011's own premise), so there
    # is no prior run to size a tighter budget against. A full desktop
    # closure (Sway, Firefox, Emacs, claude-code) plus a real graphical
    # boot, a real greetd/tuigreet login, and OCR-paced typing is
    # meaningfully heavier than vm-install-test's 30-minute budget for
    # a lighter (base+desktop only) closure.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      # Same reasoning as vm-install-test.yml's identical step: the
      # dominant cost is re-substituting the full desktop closure (and,
      # here, tesseract for OCR) on every run.
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # Same fix, same reasoning as vm-install-test.yml: nested
      # virtualization is available on GitHub's hosted runners but
      # /dev/kvm isn't group-writable by default. Failing fast here
      # matters even more for this job than for vm-install-test's: a
      # full graphical boot under TCG emulation, with OCR polling the
      # framebuffer on top, would blow past any reasonable
      # timeout-minutes budget in a way that reads as "the desktop loop
      # is broken" rather than "this runner has no KVM."
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-castle-turing-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ls -la /dev/kvm
          else
            msg="KVM unavailable on this runner; a full graphical boot under TCG would exceed the job's time budget — failing fast rather than timing out opaquely."
            echo "$msg" >&2
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # --keep-failed preserves the QEMU/OCR sandbox (screenshots
      # included) on a failing run, so a red run still leaves something
      # to look at beyond the streamed build log below — see the
      # best-effort collection step after this one. `-L` streams the
      # nixosTest driver's own log live (every wait_for_unit,
      # send_key, retry, and — on an OCR timeout — the exact screen
      # text the last attempt saw), which is the primary debugging
      # signal regardless of whether the screenshot recovery below
      # finds anything.
      # A prior version of this step's own log (before this fix) showed
      # the default runner shell as `bash -e {0}` with no `pipefail`, so
      # a bare `nix build ... | tee file` pattern let a failing `nix
      # build` (e.g. a Nix evaluation error, which exits before any VM
      # ever boots) be masked by `tee`'s own exit code — the step
      # reports success, `if: success()` steps downstream run against a
      # nonexistent/garbage result, and the job goes green for a test
      # that never ran at all. `${PIPESTATUS[0]}` below names the build
      # group's own exit code directly, which is what actually fixes
      # this. `pipefail` is set so the `if` condition's own truthiness
      # reflects the build's exit code too (without it, `tee` succeeding
      # would make the `if` true regardless of the build). Grouping the
      # build in `{ ...; }` and redirecting *inside* the group keeps
      # `--print-out-paths`'s stdout in its own clean file (the next
      # step still trusts it unconditionally — see its own comment on
      # why); only the group's stderr — the `-L` log — goes through the
      # outer pipe to `tee`, which is what docs/tasks/0041's retry below
      # greps. The pipeline sits in an `if` condition, not a bare
      # statement, because this runner's default shell is `bash -e {0}`
      # (confirmed by the very log line this comment opens with) and
      # `-e` does not abort on a command that is the test-part of an
      # `if`/`while` — a bare `{ build; } | tee log; status=$?` here
      # would `exit` the whole script on the first failure, before the
      # retry logic below ever ran.
      #
      # docs/tasks/0041: a bounded, signature-matched retry for CI's own
      # recognizable infrastructure flakes — docs/backlog/ci-flakes-
      # deserve-retries-not-vigilance.md's PR #63 incident (FlakeHub's
      # login endpoint returning a transient auth error, then the GitHub
      # Actions cache rate-limiting narinfo downloads into HTTP 418s).
      # test/ci/known-transient-ci-failure.sh holds the one commented
      # signature list this checks against; a failure that doesn't match
      # is a real regression and gets exactly zero retries. At most one
      # retry, ever: a second failure — matched or not — is surfaced
      # as-is, because two failures on the same runner are no longer
      # "transient" by this entry's own definition.
      - name: Build and run the desktop-loop test
        run: |
          set -uo pipefail
          attempt=1
          while :; do
            if { nix build .#desktop-loop-test -L --keep-failed --no-link --print-out-paths \
                   > /tmp/desktop-loop-out-path.txt; } 2>&1 | tee /tmp/desktop-loop-build.log; then
              exit 0
            fi
            status="${PIPESTATUS[0]}"
            if [ "$attempt" -ge 2 ] || ! test/ci/known-transient-ci-failure.sh /tmp/desktop-loop-build.log; then
              exit "$status"
            fi
            msg="Attempt $attempt failed with a known-transient CI signature (see test/ci/known-transient-ci-failure.sh); retrying once."
            echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
            attempt=$((attempt + 1))
          done

      # The store path is validated, not trusted blindly: the same
      # failure this step's header comment describes (a masked `nix
      # build` failure) previously left /tmp/desktop-loop-out-path.txt
      # empty, which turned `cp -r "$OUT"/.` into `cp -r /.` — copying
      # the runner's entire filesystem (21,881 files, including a
      # /dev/fd/0 special file that then broke the upload step) into
      # what was supposed to be a small screenshots directory. Refusing
      # to copy from anything that isn't a real /nix/store path turns
      # that failure mode into a loud, immediate error instead of a
      # silent 21,881-file artifact.
      - name: Collect artifacts (screenshots) from a successful run
        if: success()
        run: |
          set -euo pipefail
          mkdir -p desktop-loop-artifacts
          OUT="$(cat /tmp/desktop-loop-out-path.txt)"
          case "$OUT" in
            /nix/store/*) ;;
            *)
              echo "desktop-loop-out-path.txt did not contain a Nix store path (got: '$OUT'); refusing to copy from it." >&2
              exit 1
              ;;
          esac
          cp -r "$OUT"/. desktop-loop-artifacts/
          echo "Collected $(find desktop-loop-artifacts -type f | wc -l) file(s) from $OUT"

      # Best-effort only: --keep-failed's build directory may be owned
      # by a nix build user other than the runner's own account, and
      # its exact naming isn't a stable contract this step should fail
      # the job over. sudo + a wide glob + swallowed cp errors, same
      # spirit as vm-install-test.yml's if-no-files-found: ignore on
      # its own log upload — but the file count below is printed
      # either way, so "found nothing" is a visible, explicit line in
      # the log rather than indistinguishable from "found everything."
      - name: Collect artifacts (screenshots) from a failed run
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p desktop-loop-artifacts
          sudo find /tmp -maxdepth 1 -name 'nix-build-*desktop-loop*' \
            -exec sh -c 'cp -r "$1"/. desktop-loop-artifacts/ 2>/dev/null' _ {} \; || true
          sudo chown -R "$(id -u):$(id -g)" desktop-loop-artifacts || true
          echo "Collected $(find desktop-loop-artifacts -type f | wc -l) file(s) from any --keep-failed build directory found"

      - name: Upload desktop-loop-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-loop-test-artifacts
          path: desktop-loop-artifacts/
          if-no-files-found: ignore
          retention-days: 14
